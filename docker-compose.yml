version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: family-ledger-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/family_ledger?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=hermes
      - SPRING_DATASOURCE_PASSWORD=hermes_ledger_2026
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - ledger-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: family-ledger-frontend
    ports:
      - "5175:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ledger-net

networks:
  ledger-net:
    driver: bridge
